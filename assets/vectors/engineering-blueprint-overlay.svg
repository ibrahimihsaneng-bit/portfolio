<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
    <defs>
        <pattern id="bp-grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#F59E46" stroke-width="0.75" stroke-opacity="0.25" />
            <circle cx="0" cy="0" r="1.5" fill="#F59E46" fill-opacity="0.4" />
        </pattern>
    </defs>
    
    <!-- Background Grid -->
    <rect width="800" height="800" fill="url(#bp-grid)" />

    <!-- Concentric Technical Drafting Circles -->
    <circle cx="400" cy="400" r="120" stroke="#F59E46" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <circle cx="400" cy="400" r="220" stroke="#F59E46" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="400" cy="400" r="320" stroke="#45BEC9" stroke-width="1.2" stroke-dasharray="8 6" stroke-opacity="0.45" />
    <circle cx="400" cy="400" r="370" stroke="#F59E46" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Center Crosshairs and Alignment Axes -->
    <line x1="400" y1="20" x2="400" y2="780" stroke="#F59E46" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.5" />
    <line x1="20" y1="400" x2="780" y2="400" stroke="#F59E46" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.5" />
    
    <!-- Diagonal Protractor Lines -->
    <line x1="150" y1="150" x2="650" y2="650" stroke="#45BEC9" stroke-width="0.8" stroke-dasharray="4 6" stroke-opacity="0.35" />
    <line x1="650" y1="150" x2="150" y2="650" stroke="#45BEC9" stroke-width="0.8" stroke-dasharray="4 6" stroke-opacity="0.35" />

    <!-- Corner Technical Tick Crosshairs -->
    <g stroke="#F59E46" stroke-width="1.5" stroke-opacity="0.6">
        <path d="M 40 50 L 60 50 M 50 40 L 50 60" />
        <path d="M 740 50 L 760 50 M 750 40 L 750 60" />
        <path d="M 40 750 L 60 750 M 50 740 L 50 760" />
        <path d="M 740 750 L 760 750 M 750 740 L 750 760" />
    </g>
</svg>